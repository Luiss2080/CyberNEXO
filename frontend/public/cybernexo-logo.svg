<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0011ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0055;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Rect -->
  <rect width="120" height="120" rx="24" fill="#0b0f19" />
  <rect width="120" height="120" rx="24" fill="none" stroke="#1a2235" stroke-width="2" />

  <!-- Outer Shield -->
  <path d="M 60 15 L 100 30 L 100 65 C 100 95 60 105 60 105 C 60 105 20 95 20 65 L 20 30 Z" fill="#0a192f" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Inner Network Node -->
  <circle cx="60" cy="50" r="12" fill="none" stroke="url(#grad2)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="60" cy="50" r="4" fill="#ffffff" />
  
  <!-- Connections -->
  <path d="M 60 62 L 60 85" stroke="url(#grad2)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="60" cy="85" r="4" fill="#ffffff"/>
  
  <path d="M 49 45 L 35 35" stroke="url(#grad2)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="35" cy="35" r="4" fill="#ffffff"/>
  
  <path d="M 71 45 L 85 35" stroke="url(#grad2)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="85" cy="35" r="4" fill="#ffffff"/>
</svg>
